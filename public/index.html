<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHR Intérim</title>
<meta name="theme-color" content="#112233">
<meta name="description" content="CHR Intérim, spécialiste des métiers HCR : espace agence, employeurs et intérimaires.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="auth" hidden></div>
<div class="shell" id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><picture><source media="(max-width: 900px)" srcset="/img/logo-compact.png" width="480" height="78"><img class="brand-logo" src="/img/logo-horizontal.png" alt="CHR Intérim, spécialiste des métiers HCR" width="720" height="171"></picture></div>
    <div class="space" id="space"></div>
    <nav class="nav" id="nav" aria-label="Rubriques"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="content">
    <header class="appbar">
      <div class="spacer"></div>
      <button class="btn sm" data-a="motdepasse">Changer mon mot de passe</button>
      <button class="btn sm mobile-only" data-a="logout">Se déconnecter</button>
      <button class="iconbtn" data-a="notifs" aria-label="Notifications" id="bell"></button>
    </header>
    <div class="demo" id="banner"></div>
    <main id="main"><div class="loading">Chargement…</div></main>
    <footer class="foot-brand">CHR Intérim · spécialiste des métiers <b>HCR</b></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="modal"></div>
<script src="/app.js"></script>
</body>
</html>
