<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHR Intérim</title>

<link rel="icon" type="image/png" href="/img/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="auth" hidden></div>
<div class="shell" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/" data-a="logo" title="Tableau de bord" aria-label="CHR Intérim : retour au tableau de bord"><picture><source media="(max-width: 600px)" srcset="/img/bandeau-mobile.png" width="1080" height="600"><source media="(max-width: 900px)" srcset="/img/bandeau-horizontal.png" width="1200" height="267"><img class="brand-logo" src="/img/bandeau-horizontal.png" alt="CHR Intérim, spécialiste des métiers HCR" width="1200" height="267"></picture></a>
    <div class="mob-bar">
      <button class="mob-menu" data-a="menu" id="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="drawer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="mob-titre">Menu</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="dot" hidden></span></button>

    </div>
    <div class="drawer" id="drawer">

      <nav class="nav" id="nav" aria-label="Rubriques"></nav>
      <div class="mob-account"><button class="btn sm" data-a="motdepasse">Changer mon mot de passe</button><button class="btn sm" data-a="logout">Se déconnecter</button></div>
      <div class="me" id="me"></div>
    </div>
  </aside>
  <div class="content">
    <header class="appbar">
      <div class="spacer"></div>
      <button class="btn sm" data-a="motdepasse">Changer mon mot de passe</button>
      <button class="iconbtn bell" data-a="notifs" aria-label="Notifications"></button>
    </header>
    <div class="demo" id="banner"></div>
    <main id="main"><div class="loading">Chargement…</div></main>
    <footer class="foot-brand">CHR Intérim · spécialiste des métiers <b>HCR</b></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="modal"></div>
<script src="/app.js"></script>
